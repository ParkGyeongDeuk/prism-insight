services:
  prism-insight:
    extra_hosts:
      # Local experiment: pin KRX Akamai edge while keeping Host=data.krx.co.kr.
      # Override with PRISM_KRX_FORCE_IP if this edge becomes slow or unavailable.
      - "data.krx.co.kr:${PRISM_KRX_FORCE_IP:-23.53.2.121}"

    environment:
      - ENABLE_CRON=${PRISM_ENABLE_CRON:-false}
      - PRISM_OPENAI_AUTH_MODE=${PRISM_OPENAI_AUTH_MODE:-chatgpt_oauth}
      - PRISM_OAUTH_CALLBACK_HOST=${PRISM_OAUTH_CALLBACK_HOST:-0.0.0.0}
      - PRISM_KR_MAX_SLOTS=${PRISM_KR_MAX_SLOTS:-5}
      - PRISM_KR_TOTAL_BUDGET=${PRISM_KR_TOTAL_BUDGET:-2000000}
      - PRISM_KR_CASH_RESERVE=${PRISM_KR_CASH_RESERVE:-400000}
      - PRISM_GENERATE_PDF_REPORTS=${PRISM_GENERATE_PDF_REPORTS:-false}
      - PRISM_SEND_PDF_REPORTS=${PRISM_SEND_PDF_REPORTS:-false}
      - PATH=/root/.local/bin:/app/venv/bin:/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      # Keep KIS credentials outside the image and persist ChatGPT OAuth tokens.
      - ./trading/config/kis_devlp.yaml:/app/prism-insight/trading/config/kis_devlp.yaml
      - prism-auth:/root/.config/prism-insight
      - ./docker/crontab.kd:/app/prism-insight/docker/crontab:ro

    # OAuth redirects to localhost; expose the callback only on this Mac.
    ports:
      - "127.0.0.1:1455:1455"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c 'import sys; sys.exit(0)' &&
          if [ "$${ENABLE_CRON}" = "true" ]; then service cron status; else exit 0; fi

volumes:
  prism-auth:
    driver: local
